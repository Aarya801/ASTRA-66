arrow" marker-end="url(#b-elec)"/><text x="770.0" y="194.0" text-anchor="middle" class="td ts">SPI</text><rect x="850.0" y="250.0" width="170.0" height="56.0" rx="4.0" class="box"/><text x="935.0" y="276.0" text-anchor="middle" class="tb ts">GPS MODULE</text><text x="935.0" y="292.0" text-anchor="middle" class="tm ts">in payload bay · I-08</text><line x1="848" y1="278" x2="694" y2="255" class="arrow" marker-end="url(#b-elec)"/><text x="771.0" y="260.5" text-anchor="middle" class="td ts">UART</text><rect x="850.0" y="340.0" width="170.0" height="50.0" rx="4.0" class="box"/><text x="935.0" y="363.0" text-anchor="middle" class="tb ts">BREAKWIRE @ I-03</text><text x="935.0" y="379.0" text-anchor="middle" class="tm ts">separation sense</text><rect x="470.0" y="350.0" width="220.0" height="50.0" rx="4.0" class="box"/><text x="580.0" y="379.0" text-anchor="middle" class="tb ts">BUZZER + STATUS LED</text><line x1="848" y1="365" x2="694" y2="280" class="arrow" marker-end="url(#b-elec)"/><text x="771.0" y="316.5" text-anchor="middle" class="td ts">GPIO in</text><line x1="580" y1="292" x2="580" y2="348" class="arrow" marker-end="url(#b-elec)"/><text x="580.0" y="314.0" text-anchor="middle" class="td ts">GPIO out</text><line x1="1022" y1="175" x2="1150" y2="175" class="arrowdim" marker-end="url(#a-elec)"/><text x="1100.0" y="162.0" text-anchor="middle" class="td ts">downlink</text><rect x="260.0" y="400.0" width="170.0" height="50.0" rx="4.0" class="boxdim"/><text x="345.0" y="423.0" text-anchor="middle" class="tb ts">CAMERA</text><text x="345.0" y="439.0" text-anchor="middle" class="tm ts">own battery, isolated</text><rect x="20.0" y="18.0" width="1160.0" height="444.0" rx="8.0" class="hid"/><text x="40.0" y="34.0" text-anchor="start" class="ta tb ts">NO PYROTECHNIC OUTPUTS — sensing, logging and telemetry only</text></svg>