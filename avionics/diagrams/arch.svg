<svg style="background:#F4F5F2" viewBox="0 0 1200 520" role="img" aria-label="System architecture: four airframe modules with numbered interfaces, recovery tether, external certified motor, launch rail and ground station" xmlns="http://www.w3.org/2000/svg"><style>
.ln{fill:none;stroke:#1B2126;stroke-width:1.3;stroke-linejoin:round}.thin{stroke-width:.8}
