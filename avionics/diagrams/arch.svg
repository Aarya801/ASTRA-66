ta">300</text><text x="534.0" y="200.0" text-anchor="start" class="tb">AVIONICS BAY</text><text x="534.0" y="220.0" text-anchor="start" class="tm ts">sled · battery · switch band</text><rect x="780.0" y="150.0" width="300.0" height="96.0" rx="4.0" class="box"/><text x="794.0" y="176.0" text-anchor="start" class="tl ta">400</text><text x="794.0" y="200.0" text-anchor="start" class="tb">BOOSTER</text><text x="794.0" y="220.0" text-anchor="start" class="tm ts">recovery bay · fin can · MMT</text><line x1="230.0" y1="132.0" x2="230.0" y2="264.0" class="ln"/><text x="230.0" y="110.0" text-anchor="middle" class="tb">I-01</text><text x="230.0" y="124.0" text-anchor="middle" class="tm ts">radial M3 into inserts</text><line x1="490.0" y1="132.0" x2="490.0" y2="264.0" class="ln"/><text x="490.0" y="110.0" text-anchor="middle" class="tb">I-02</text><text x="490.0" y="124.0" text-anchor="middle" class="tm ts">bonded coupler</text><line x1="750.0" y1="132.0" x2="750.0" y2="264.0" class="arrowacc"/><text x="750.0" y="110.0" text-anchor="middle" class="tb ta">I-03</text><text x="750.0" y="124.0" text-anchor="middle" class="tm ts ta">slip fit · SEPARATES</text><path d="M640,246 L640,316 L960,316 L960,246" class="arrowacc"/><text x="800.0" y="334.0" text-anchor="middle" class="ta ts">500 RECOVERY TETHER — eyebolt I-04a → chute &amp; cord → aramid anchor I-04b</text><path d="M420,226 C470,276 560,276 600,226" class="arrowdim"/><text x="510.0" y="290.0" text-anchor="middle" class="td ts">I-08 harness through AV-303 grommet</text><rect x="960.0" y="390.0" width="200.0" height="70.0" rx="4.0" class="boxacc"/><text x="1060.0" y="418.0" text-anchor="middle" class="tb ta">600 CERTIFIED MOTOR</text><text x="1060.0" y="436.0" text-anchor="middle" class="ta ts">EXTERNAL · purchased · RSO-handled</text><line x1="1060" y1="390" x2="1060" y2="250" class="arrowacc" marker-end="url(#c-arch)"/><text x="1070.0" y="360.0" text-anchor="start" class="ta ts">I-05 COTS retainer</text><text x="1070.0" y="3