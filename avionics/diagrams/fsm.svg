<svg style="background:#F4F5F2" viewBox="0 0 1200 190" role="img" aria-label="Flight-phase detection state machine for data logging: pad, boost, coast, apogee, descent, landed, with transition conditions" xmlns="http://www.w3.org/2000/svg"><style>
.ln{fill:none;stroke:#1B2126;stroke-width:1.3;stroke-linejoin:round}.thin{stroke-width:.8}
.body{fill:#E3E7E2;stroke:#1B2126;stroke-width:1.3}.band{fill:#D5DBD5;stroke:#1B2126;stroke-width:1}
.comp{fill:#DCE3EA;stroke:#1B2126;stroke-width:.8}.cut{stroke:#1B2126;stroke-width:1}
.hatch{stroke:#7D8784;stroke-width:.8}.hatchbg{fill:#F4F5F2}.hatchbg2{fill:#E9ECE7}
.hid{fill:none;stroke:#87918F;stroke-width:.9;stroke-dasharray:5 3}
.ctr{fill:none;stroke:#87918F;stroke-width:.7;stroke-dasharray:22 4 3 4}
.ph{fill:none;stroke:#C24A0C;stroke-width:1.2;stroke-dasharray:14 4 3 4 3 4}
.dim{fill:none;stroke:#1D6A86;stroke-width:.8}.ext{fill:none;stroke:#1D6A86;stroke-width:.6}
.mk{fill:#1D6A86}.mkink{fill:#1B2126}.mkacc{fill:#C24A0C}.ldr{fill:none;stroke:#4A545C;stroke-width:.7}.dot{fill:#4A545C}
text{font-family:'IBM Plex Mono',Consolas,monospace;font-size:12px;fill:#1B2126}
.td{fill:#1D6A86}.ta{fill:#C24A0C}.tm{fill:#4A545C}.tb{font-weight:600}.ts{font-size:10.5px}
.tl{font-size:15px;font-weight:600;letter-spacing:.06em}
.pill{fill:#F4F5F2;stroke:#1B2126;stroke-width:1}.cgf{fill:#1B2126}.cgb{fill:#F4F5F2;stroke:#1B2126;stroke-width:1.4}
.accf{fill:#C24A0C}.eye{fill:none;stroke:#1B2126;stroke-width:2.4}
.box{fill:#E9ECE7;stroke:#1B2126;stroke-width:1.1}.boxacc{fill:#F8E3D5;stroke:#C24A0C;stroke-width:1.2;stroke-dasharray:6 3}
.boxdim{fill:#DDEBF0;stroke:#1D6A86;stroke-width:1.1}
.arrow{fill:none;stroke:#1B2126;stroke-width:1.3}.arrowacc{fill:none;stroke:#C24A0C;stroke-width:1.5}
.arrowdim{fill:none;stroke:#1D6A86;stroke-width:1.3;stroke-dasharray:6 4}
</style><defs><marker id="a-fsm" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" class="mk"/></marker><marker id="b-fsm" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="mkink"/></marker><marker id="c-fsm" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="mkacc"/></marker><pattern id="h1-fsm" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" class="hatchbg"/><line x1="0" y1="0" x2="0" y2="5" class="hatch"/></pattern><pattern id="h2-fsm" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="5" height="5" class="hatchbg"/><line x1="0" y1="0" x2="0" y2="5" class="hatch"/></pattern><pattern id="h3-fsm" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="9" height="9" class="hatchbg2"/><line x1="0" y1="0" x2="0" y2="9" class="hatch"/></pattern></defs><rect x="20.0" y="70.0" width="150.0" height="60.0" rx="30.0" class="box"/><text x="95.0" y="97.0" text-anchor="middle" class="tb">PAD</text><text x="95.0" y="115.0" text-anchor="middle" class="tm ts">log 10 Hz</text><line x1="172" y1="100" x2="212" y2="100" class="arrow" marker-end="url(#b-fsm)"/><text x="192.0" y="58.0" text-anchor="middle" class="td ts">|a| &gt; 3 g for 100 ms</text><rect x="214.0" y="70.0" width="150.0" height="60.0" rx="30.0" class="box"/><text x="289.0" y="97.0" text-anchor="middle" class="tb">BOOST</text><text x="289.0" y="115.0" text-anchor="middle" class="tm ts">log max rate</text><line x1="366" y1="100" x2="406" y2="100" class="arrow" marker-end="url(#b-fsm)"/><text x="386.0" y="152.0" text-anchor="middle" class="td ts">a_axial &lt; 0</text><rect x="408.0" y="70.0" width="150.0" height="60.0" rx="30.0" class="box"/><text x="483.0" y="97.0" text-anchor="middle" class="tb">COAST</text><text x="483.0" y="115.0" text-anchor="middle" class="tm ts">watch baro</text><line x1="560" y1="100" x2="600" y2="100" class="arrow" marker-end="url(#b-fsm)"/><text x="580.0" y="58.0" text-anchor="middle" class="td ts">baro alt falls 3 samples</text><rect x="602.0" y="70.0" width="150.0" height="60.0" rx="30.0" class="boxdim"/><text x="677.0" y="97.0" text-anchor="middle" class="tb">APOGEE</text><text x="677.0" y="115.0" text-anchor="middle" class="tm ts">timestamp</text><line x1="754" y1="100" x2="794" y2="100" class="arrow" marker-end="url(#b-fsm)"/><text x="774.0" y="152.0" text-anchor="middle" class="td ts">breakwire open OR t+</text><rect x="796.0" y="70.0" width="150.0" height="60.0" rx="30.0" class="box"/><text x="871.0" y="97.0" text-anchor="middle" class="tb">DESCENT</text><text x="871.0" y="115.0" text-anchor="middle" class="tm ts">log 20 Hz</text><line x1="948" y1="100" x2="988" y2="100" class="arrow" marker-end="url(#b-fsm)"/><text x="968.0" y="58.0" text-anchor="middle" class="td ts">baro rate ≈ 0 for 5 s</text><rect x="990.0" y="70.0" width="150.0" height="60.0" rx="30.0" class="box"/><text x="1065.0" y="97.0" text-anchor="middle" class="tb">LANDED</text><text x="1065.0" y="115.0" text-anchor="middle" class="tm ts">beep + GPS</text><text x="20.0" y="24.0" text-anchor="start" class="tm ts">RECOVERY-DETECTION CONCEPT (LOGGING ONLY) · thresholds are ASSUMPTIONS to tune from ground and flight data</text></svg>